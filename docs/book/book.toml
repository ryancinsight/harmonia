[book]
title = "harmonia: Multiphysics Coupling for Atlas"
authors = ["Ryan Clanton"]
src = "."
language = "en"
[build]
build-dir = "../../target/book/harmonia"
create-missing = false

# `mdbook test` compiles fenced `rust` blocks as doctests; the edition must
# match the crate so book samples parse exactly as the package does.
[rust]
edition = "2024"
[output.html]
no-section-label = false
mathjax-support = true
site-url = "/harmonia/"
git-repository-url = "https://github.com/ryancinsight/harmonia"
default-theme = "rust"