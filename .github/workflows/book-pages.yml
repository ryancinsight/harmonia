name: Deploy mdBook

on:

  push:

    branches: [main]

    paths: ["docs/book/**",".github/workflows/book-pages.yml"]

  pull_request:

    paths: ["docs/book/**",".github/workflows/book-pages.yml"]

  workflow_dispatch:

permissions:

  contents: read

concurrency:

  group: book-pages-${{ github.ref }}

  # Deploys queue behind one another; a half-cancelled deploy is worse than a
  # superseded one, and a cancelled default-branch run leaves that merge undeployed.
  cancel-in-progress: false

jobs:

  deploy:

    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@20c93980f7c98f2e23a89c4a0540f16c8f2d7239

    permissions:

      contents: read

      pages: write

      id-token: write

    with:

      output-path: target/book/harmonia

      # The book sample is an `{{#include}}` of the crate's runnable example,

      # so `mdbook test` compiles and runs exactly the code the chapter shows.

      mdbook-test: true

      # harmonia's closure covers every crate the sample names: athena-core and

      # horae directly, aequitas transitively through horae. The workflow stages

      # one plain-named rlib per crate for `mdbook test --library-path`.

      cargo-package: harmonia

      # Must match rust-toolchain.toml: cargo build honours the pin while

      # mdbook spawns rustdoc from the installed default, and a mismatch

      # fails E0514 (crate compiled by an incompatible rustc).

      rust-toolchain: "1.97.0"