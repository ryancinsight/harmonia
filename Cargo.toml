[package]
name = "harmonia"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
description = "Atlas partitioned multiphysics coupling orchestration"
repository = "https://github.com/ryancinsight/harmonia"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["multiphysics", "coupling", "simulation", "no-std"]
categories = ["no-std", "science"]
publish = false

[dependencies]
athena-core = { version = "0.1.0", git = "https://github.com/ryancinsight/athena", default-features = false }
eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }
horae = { version = "0.1.0", git = "https://github.com/ryancinsight/horae", default-features = false }

[dev-dependencies]
aequitas = { version = "0.2.0", git = "https://github.com/ryancinsight/aequitas" }
proptest = "1.11.0"
stats_alloc = "0.1.10"

[features]
default = ["std"]
std = ["eunomia/std", "horae/std"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Pedantic floor: this crate is pedantic-clean. The census that established
# this floor (`cargo clippy --all-targets`) found zero hits in every pedantic
# class, so there is no allow-list and no ratchet -- every pedantic lint is a
# hard error. A new hit is fixed, never allowed here.

# --- Restriction floor ---
# Zero production `unwrap()` sites, so `unwrap_used` is denied outright with no
# per-file `expect` ratchet. Library output belongs to the caller's logging
# layer, so the print/`dbg!` family is denied too; `examples/` carry a per-file
# `#![expect(...)]` because a runnable example's stdout is its deliverable.
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[profile.dev]
debug = "line-tables-only"
overflow-checks = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
overflow-checks = true

[profile.release]
debug = false
strip = "symbols"
overflow-checks = true
